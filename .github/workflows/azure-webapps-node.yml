name: Build and Deploy Frontend to AKS

# Push to master builds a container image, pushes it to ACR, and rolls the
# `frontend` deployment on the AKS cluster (same cluster as the backend).
# Replaces the old Azure App Service ("ccra-project") deployment.
#
# Auth without an Azure service principal (school accounts can't register apps):
#   - ACR_USERNAME / ACR_PASSWORD : ACR admin login (push images)
#   - KUBE_CONFIG                 : base64 of the AKS admin kubeconfig (deploy)

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ccraregistry.azurecr.io
  IMAGE: frontend
  NAMESPACE: ccra
  DEPLOYMENT: frontend            # k8s deployment + container name
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # QEMU + Buildx let the x64 runner build a linux/arm64 image to match the
      # AKS node architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:latest
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}

      # Write the AKS admin kubeconfig (stored base64-encoded) so kubectl can auth.
      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT }} \
            ${{ env.DEPLOYMENT }}=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT }} -n ${{ env.NAMESPACE }} --timeout=180s
